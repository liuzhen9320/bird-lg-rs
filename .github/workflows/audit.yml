# eslint-disable yml/no-empty-mapping-value
name: Security Audit

on:
  schedule:
    - cron: "48 2 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  audit:
    name: job ❯ cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # ─────────────────────────────────────────────────────
      - name: Bootstrap ❯❯ actions/checkout@v6
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Bootstrap ❯❯ Setup Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable

      - name: Bootstrap ❯❯ Debug ❯❯ Show version information
        run: |
          rustup -V
          cargo -V
          rustc -V

      - name: Bootstrap ❯❯ Install cargo-audit
        run: cargo install cargo-audit

      - name: Run ❯❯ cargo audit
        run: cargo audit
